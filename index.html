<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MOVIRIS · Lee el fuego antes de que avance. Monitoreo y visualización de focos de calor en Ecuador.">
  <title>MOVIRIS · Lee el fuego antes de que avance</title>
  <link rel="icon" href="/ico.svg" type="image/svg+xml">
  <script>
    document.documentElement.classList.replace('no-js', 'js');
    window.setTimeout(function () {
      document.documentElement.classList.add('is-loaded');
    }, 1800);
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <canvas class="network" id="network" aria-hidden="true"></canvas>

  <div class="page">
    <main class="hero">
      <div class="copy">
        <p class="eyebrow reveal" style="--delay: 160ms">
          <span class="eyebrow-line" aria-hidden="true"></span>
          Focos de calor · Ecuador
        </p>

        <h1 class="headline">
          <span class="line"><span class="line-inner" style="--delay: 220ms">Lee el fuego</span></span>
          <span class="line"><span class="line-inner" style="--delay: 340ms">antes de que <em>avance.</em></span></span>
        </h1>

        <p class="subtitle reveal" style="--delay: 520ms">
          Más de una década de focos de calor en Ecuador, en un solo calendario.
        </p>

        <div class="actions reveal" style="--delay: 660ms">
          <a class="cta" id="cta" href="/inicio/">
            <span>Explorar el fuego</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <p class="cta-note">Datos satelitales · NASA FIRMS</p>
        </div>
      </div>

      <div class="art reveal" style="--delay: 500ms">
        <svg class="sat" viewBox="0 0 240 240" role="img" aria-label="Satélite orbitando la Tierra">
          <!-- Marcas del anillo exterior -->
          <circle class="sat-ticks" cx="120" cy="120" r="112" fill="none" stroke-width="7" stroke-dasharray="1.2 10.9"/>
          <!-- Línea fina del anillo exterior -->
          <circle class="sat-ring" cx="120" cy="120" r="112" fill="none"/>
          <!-- Órbita -->
          <circle class="sat-orbit" cx="120" cy="120" r="78" fill="none" stroke-width="2.5"/>
          <!-- Tierra -->
          <circle class="sat-earth" cx="120" cy="120" r="24"/>
          <!-- Satélite -->
          <g class="orb">
            <circle class="sat-node" cx="120" cy="42" r="18" stroke-width="2"/>
            <g class="sat-parts" transform="rotate(-30 120 42)">
              <rect x="116" y="38" width="8" height="8"/>
              <rect x="103" y="39" width="12" height="6"/>
              <rect x="125" y="39" width="12" height="6"/>
            </g>
          </g>
        </svg>
      </div>
    </main>

    <section class="facts reveal" style="--delay: 780ms" aria-label="Datos del proyecto">
      <div class="fact"><strong>2012–2026</strong><span>Período</span></div>
      <div class="fact"><strong>MODIS + VIIRS</strong><span>Sensores</span></div>
      <div class="fact"><strong>0,01°</strong><span>Malla común</span></div>
    </section>
  </div>

  <script src="/script.js"></script>
</body>
</html>
